[workspace]
members = [
    "core",
    "macros",
    "ledger",
    "snark",
    "p2p",
    "p2p/testing",
    "p2p/libp2p-rpc-behaviour",
    "node",
    "node/account",
    "node/native",
    "node/invariants",
    "node/testing",
    "cli",
    "cli/replay_dynamic_effects",
    "vrf",

    "mina-p2p-messages",
    "ledger",

    "tools/transport",
    "tools/bootstrap-sandbox",
    "tools/gossipsub-sandbox",
    "tools/hash-tool",
    "tools/ledger-tool",
    "tools/salsa-simple",
    "producer-dashboard",

    "fuzzer",
]

resolver = "2"

[workspace.dependencies]
mina-p2p-messages = { path = "mina-p2p-messages", features = ["hashing"] }
ledger = { path = "ledger", package = "mina-tree" }
mina-hasher = { git = "https://github.com/lambdaclass/openmina-proof-systems", rev = "44e0d3b98b8747de54e595f53d97c035ff43167c" }
mina-signer = { git = "https://github.com/lambdaclass/openmina-proof-systems", rev = "44e0d3b98b8747de54e595f53d97c035ff43167c" }
mina-curves = { git = "https://github.com/lambdaclass/openmina-proof-systems", rev = "44e0d3b98b8747de54e595f53d97c035ff43167c" }
o1-utils = { git = "https://github.com/lambdaclass/openmina-proof-systems", rev = "44e0d3b98b8747de54e595f53d97c035ff43167c" }
kimchi = { git = "https://github.com/lambdaclass/openmina-proof-systems", rev = "44e0d3b98b8747de54e595f53d97c035ff43167c" }
mina-poseidon = { git = "https://github.com/lambdaclass/openmina-proof-systems", rev = "44e0d3b98b8747de54e595f53d97c035ff43167c" }
poly-commitment = { git = "https://github.com/lambdaclass/openmina-proof-systems", rev = "44e0d3b98b8747de54e595f53d97c035ff43167c" }
libp2p = { git = "https://github.com/lambdaclass/openmina-rust-libp2p", rev = "cd5425a759d959d7fde58a42f71ab059449760c5", default-features = false }
vrf = { path = "vrf" }
redux = { git = "https://github.com/lambdaclass/redux-rs", rev = "2d1d8db", features = [
    "serde",
] }
serde = "1.0.190"
serde_json = "1.0.107"
serde_with = { version = "3.7.0", features = ["hex"] }
linkme = "0.3.22"
static_assertions = "1.1.0"

[profile.fuzz]
inherits = "release"
opt-level = 3
debug = 2
debug-assertions = true # TODO: test and disable if too slow
overflow-checks = true
lto = false
panic = "abort"
incremental = false
codegen-units = 1

[patch.crates-io]
ark-ff = { git = "https://github.com/lambdaclass/openmina_algebra", rev = "017531e7aaa15a2c856532b0843876e371b01122" }
ark-ec = { git = "https://github.com/lambdaclass/openmina_algebra", rev = "017531e7aaa15a2c856532b0843876e371b01122" }
ark-poly = { git = "https://github.com/lambdaclass/openmina_algebra", rev = "017531e7aaa15a2c856532b0843876e371b01122" }
ark-serialize = { git = "https://github.com/lambdaclass/openmina_algebra", rev = "017531e7aaa15a2c856532b0843876e371b01122" }

[patch.'https://github.com/openmina/algebra']
ark-ff = { git = "https://github.com/lambdaclass/openmina_algebra", rev = "017531e7aaa15a2c856532b0843876e371b01122" }
ark-ec = { git = "https://github.com/lambdaclass/openmina_algebra", rev = "017531e7aaa15a2c856532b0843876e371b01122" }
ark-poly = { git = "https://github.com/lambdaclass/openmina_algebra", rev = "017531e7aaa15a2c856532b0843876e371b01122" }
ark-serialize = { git = "https://github.com/lambdaclass/openmina_algebra", rev = "017531e7aaa15a2c856532b0843876e371b01122" }

[profile.test.package."*"]
opt-level = 3
debug-assertions = true
overflow-checks = false
